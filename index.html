<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONK-BAK · Liga Čovječe ne ljuti se</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    body{
      min-height:100vh;background:#0b0906;color:#efe6d3;
      font-family:Oswald,system-ui,sans-serif;overflow:hidden;
    }

    /* rezan kamen umjesto foto pozadine */
    body:before{
      content:"";position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(circle at 18% -8%, rgba(217,164,65,.18), transparent 34%),
        radial-gradient(circle at 86% 10%, rgba(193,67,42,.15), transparent 32%),
        radial-gradient(circle at 50% 118%, rgba(217,164,65,.09), transparent 42%),
        repeating-linear-gradient(115deg, rgba(255,255,255,.014) 0 2px, transparent 2px 5px),
        linear-gradient(180deg,#0d0a07 0%,#0b0906 45%,#080604 100%);
    }
    /* golemi vodeni žig sove iza kartice */
    body:after{
      content:"";position:fixed;left:50%;top:50%;width:900px;height:900px;
      transform:translate(-50%,-50%);
      background:url('logo.png') center/contain no-repeat;
      opacity:.045;filter:grayscale(1) brightness(3);pointer-events:none;
    }

    .page{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}

    .card{
      width:min(720px,94vw);padding:52px 44px;text-align:center;position:relative;
      border:1px solid rgba(217,164,65,.3);border-radius:8px;
      background:linear-gradient(180deg,#1e1810,#171310);
      box-shadow:0 30px 80px rgba(0,0,0,.6);
    }
    .card:before,.card:after{
      content:"";position:absolute;left:22px;right:22px;height:2px;
      background:linear-gradient(90deg,transparent,#f0c674,transparent);opacity:.5;
    }
    .card:before{top:14px}
    .card:after{bottom:14px}

    .logo{width:172px;max-width:55vw;filter:drop-shadow(0 0 18px rgba(217,164,65,.4));margin-bottom:22px}
    .eyebrow{letter-spacing:6px;text-transform:uppercase;color:#a89877;font-size:.82rem;font-weight:600}
    .title{
      font-family:Cinzel,serif;font-weight:900;font-size:clamp(2.6rem,9vw,5.2rem);line-height:.95;
      color:#f0c674;text-shadow:0 0 24px rgba(217,164,65,.4);margin:14px 0 6px;
    }
    .sub{font-size:clamp(1rem,2.6vw,1.35rem);color:#a89877;font-style:italic;font-family:Georgia,serif;margin-bottom:34px}

    .enter{
      display:inline-flex;align-items:center;gap:12px;padding:17px 42px;border-radius:6px;
      text-decoration:none;background:linear-gradient(135deg,#c1432a,#e2603f);color:#fff2e8;
      font-weight:700;font-size:1.05rem;letter-spacing:2px;text-transform:uppercase;
      border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 28px rgba(193,67,42,.4);
      transition:.18s ease;
    }
    .enter:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(193,67,42,.55)}

    .rope{
      height:5px;margin:30px auto 0;width:min(300px,70%);border-radius:3px;
      background:repeating-linear-gradient(-45deg,#d9a441 0 8px,#8a5a22 8px 16px);opacity:.5;
    }
    .note{margin-top:18px;color:#6b5f47;letter-spacing:3px;text-transform:uppercase;font-size:.74rem}

    @media(max-width:600px){.card{padding:36px 22px}.enter{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <img class="logo" src="logo.png" alt="ONK-BAK">
      <div class="eyebrow">Liga Čovječe ne ljuti se</div>
      <h1 class="title">ONK-BAK</h1>
      <p class="sub">Igra nije samo sreća. Igra je stav.</p>
      <a href="app.html" class="enter">Ulaz u arenu</a>
      <div class="rope"></div>
      <div class="note">Noćna liga · Časni sud kocke</div>
    </section>
  </main>
</body>
</html>
